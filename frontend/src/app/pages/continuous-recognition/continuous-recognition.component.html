<div class="columns">
  <div class="column is-relative is-flex is-flex-direction-column is-align-items-center">
    <app-video (handLandmarkResults)="onHandResult($event)"></app-video>
    <div class="hovering-subtitles box" [class.is-hidden]="recognizedSentence.length === 0" [class.is-flex]="recognizedSentence.length > 0">
      <span class="subtitle">{{recognizedSentence.join('')}}</span>
    </div>
  </div>
</div>
